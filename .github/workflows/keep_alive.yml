name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */3 * * *' # Gira ogni 3 ore
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Installa Python e Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          pip install selenium

      - name: Simula visita browser reale
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chromium.options import ChromiumOptions
          import time

          options = ChromiumOptions()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')

          driver = webdriver.Chrome(options=options)
          print('Apertura app Streamlit...')
          driver.get('https://myclimbing.streamlit.app')
          
          # Aspetta 15 secondi per far caricare i componenti dell'app
          time.sleep(15) 
          
          print('Titolo pagina:', driver.title)
          driver.quit()
          print('Ping completato con successo!')
          "
