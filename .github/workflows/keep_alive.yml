name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */3 * * *' # Gira ogni 3 ore
  workflow_dispatch: # Permette di lanciarlo anche manualmente

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Selenium
        run: pip install selenium

      - name: Simula visita browser reale
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time

          options = Options()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          # Maschera il bot con un User-Agent reale
          options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')

          driver = webdriver.Chrome(options=options)
          
          print('Apertura app Streamlit...')
          driver.get('https://myclimbing.streamlit.app/')
          
          time.sleep(15)
          
          print('Titolo pagina:', driver.title)
          driver.quit()
          print('Ping completato con successo!')
          "
